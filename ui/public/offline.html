<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline — Paperclip</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #6b7280;
        --border: #e5e7eb;
        --card: #f9fafb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
          --card: #18181b;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, "Noto Sans Arabic", "Noto Sans", sans-serif;
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }
      .card {
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 0.75rem;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0.75rem 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 0.95rem;
      }
      .ar {
        direction: rtl;
        text-align: right;
      }
      .icon {
        width: 3rem;
        height: 3rem;
        border-radius: 0.5rem;
        background: var(--fg);
        color: var(--bg);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        margin-bottom: 1rem;
      }
      button {
        margin-top: 1.25rem;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 500;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid var(--border);
        background: var(--fg);
        color: var(--bg);
        cursor: pointer;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 1.25rem 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="icon">P</div>
        <h1>You're offline</h1>
        <p>This page can't be loaded right now. Once your connection comes back, your work will continue to sync automatically.</p>
        <hr />
        <div class="ar">
          <h1>أنت غير متصل بالإنترنت</h1>
          <p>تعذّر تحميل هذه الصفحة الآن. عند عودة الاتصال ستستمر بياناتك في المزامنة تلقائياً.</p>
        </div>
        <button onclick="location.reload()">Retry / إعادة المحاولة</button>
      </div>
    </main>
  </body>
</html>
